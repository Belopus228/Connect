name: Build PC (native .NET)

on:
  push:
  workflow_dispatch:

jobs:
  build-pc:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish native Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pc-out | Out-Null
          dotnet publish pc/ConnectPC.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o pc-out 2>&1 | Tee-Object pc-build-log.txt
          "PUBLISH_EXIT=$LASTEXITCODE" | Add-Content pc-build-log.txt
          if (-not (Test-Path pc-out/ConnectPC.exe)) { Copy-Item pc-build-log.txt ci-output-pc-build-log.txt -ErrorAction SilentlyContinue }

      - name: Commit EXE
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ci-output/pc | Out-Null
          if (Test-Path pc-out/ConnectPC.exe) { Copy-Item pc-out/ConnectPC.exe ci-output/pc/Connect-PC.exe }
          if (Test-Path pc-build-log.txt) { Copy-Item pc-build-log.txt ci-output/pc/pc-build-log.txt }
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add ci-output/pc/Connect-PC.exe ci-output/pc/pc-build-log.txt
          git commit -m "PC native build [skip ci]" 2>$null
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
