name: Build PC (Windows EXE)

on:
  push:
    branches:
      - "arena/**"
      - main
    paths:
      - "pc/**"
      - ".github/workflows/build-pc.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pc:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build EXE
        working-directory: pc
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Connect-PC ConnectPC.py 2>&1 | Tee-Object -FilePath ..\pc-build-log.txt
          if (-not (Test-Path dist\Connect-PC.exe)) { throw "Connect-PC.exe was not produced" }
          Get-Item dist\Connect-PC.exe | Format-List Name,Length

      - name: Commit EXE back to branch
        if: always()
        shell: bash
        run: |
          mkdir -p ci-output/pc
          cp pc-build-log.txt ci-output/pc/pc-build-log.txt || echo "no log" > ci-output/pc/pc-build-log.txt
          if [ -f pc/dist/Connect-PC.exe ]; then
            cp pc/dist/Connect-PC.exe ci-output/pc/Connect-PC.exe
            ls -lh ci-output/pc/
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f ci-output/pc/pc-build-log.txt ci-output/pc/Connect-PC.exe || git add -f ci-output/pc/pc-build-log.txt
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "CI: PC build results (EXE + log) [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push origin HEAD:${{ github.ref_name }}
          fi
