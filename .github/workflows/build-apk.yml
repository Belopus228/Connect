name: Build APK

on:
  push:
    branches:
      - "arena/**"
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build-log.txt

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Connect-Electronics-Simulator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit build results back to branch
        if: always()
        run: |
          mkdir -p ci-output
          cp build-log.txt ci-output/build-log.txt || echo "no build log" > ci-output/build-log.txt
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk ci-output/Connect-Electronics-Simulator.apk
            ls -lh ci-output/
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f ci-output/build-log.txt ci-output/Connect-Electronics-Simulator.apk || git add -f ci-output/build-log.txt
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "CI: build results (APK + log) [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push origin HEAD:${{ github.ref_name }}
          fi
